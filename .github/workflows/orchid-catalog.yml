name: Orchid Catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/orchid-catalog.yml"
      - "Tools/OrchidPipeline/**"
  schedule:
    - cron: "16 */2 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy the current snapshot even when content is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: orchid-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate feed data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.summary.outputs.changed }}
      content_version: ${{ steps.summary.outputs.content_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Test snapshot builder
        run: ruby Tools/OrchidPipeline/test/orchid_pipeline_test.rb

      - name: Restore the last known good snapshot and source state
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/orchid/public
          if git ls-remote --exit-code --heads origin orchid-data >/dev/null 2>&1; then
            git fetch --no-tags origin orchid-data:refs/remotes/origin/orchid-data
            git show origin/orchid-data:.source-state.json > .build/orchid/source-state.json
            git archive origin/orchid-data public | tar -x -C .build/orchid
          fi

      - name: Incrementally build the Taiwan feed snapshot
        id: catalog
        env:
          ORCHID_SOURCE_URL: ${{ secrets.ORCHID_SOURCE_URL }}
        run: |
          ruby Tools/OrchidPipeline/bin/build_orchid \
            --output .build/orchid/public \
            --state .build/orchid/source-state.json \
            --summary .build/orchid/summary.json \
            --region TW \
            --language zh-TW \
            --verified-only \
            --max-pages 1 \
            --vector-batch-size 4 \
            --vector-request-budget 4 \
            --playlist-batch-size 12 \
            --request-budget 24 \
            --track-max-age 48 \
            --minimum-collections 20 \
            --minimum-playlist-success-rate 0.8

      - name: Validate the complete public graph
        run: ruby Tools/OrchidPipeline/bin/validate_snapshot .build/orchid/public

      - name: Export build result
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          changed=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("changed")' .build/orchid/summary.json)
          version=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("contentVersion")' .build/orchid/summary.json)
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "content_version=${version}" >> "$GITHUB_OUTPUT"
          cat .build/orchid/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Persist source state and immutable objects
        if: always() && steps.restore.outcome == 'success' && (steps.catalog.outcome == 'success' || steps.catalog.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/orchid-data"
          if git show-ref --verify --quiet refs/remotes/origin/orchid-data; then
            git worktree add --detach "$publish_dir" origin/orchid-data
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan orchid-data
          fi

          rm -rf "$publish_dir/public"
          cp -R .build/orchid/public "$publish_dir/public"
          cp .build/orchid/source-state.json "$publish_dir/.source-state.json"
          touch "$publish_dir/.nojekyll"

          git -C "$publish_dir" config user.name "orchid-data-bot"
          git -C "$publish_dir" config user.email "orchid-data-bot@users.noreply.github.com"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Source state and feed objects are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git -C "$publish_dir" commit -m "Update Orchid catalog"
            git -C "$publish_dir" push origin HEAD:orchid-data
          fi

      - name: Prepare GitHub Pages
        if: >-
          vars.ORCHID_PAGES_ENABLED == 'true' &&
          (steps.summary.outputs.changed == 'true' || inputs.force_deploy == true)
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          vars.ORCHID_PAGES_ENABLED == 'true' &&
          (steps.summary.outputs.changed == 'true' || inputs.force_deploy == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/orchid/public

  deploy:
    name: Publish feed snapshot
    needs: build
    if: >-
      vars.ORCHID_PAGES_ENABLED == 'true' &&
      (needs.build.outputs.changed == 'true' || inputs.force_deploy == true)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
